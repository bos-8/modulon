# Docker DNS resolver (important for container name resolution)
resolver 127.0.0.11 ipv6=off valid=10s;

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Upstreams (DEV host services + in-network services)
upstream next_dev {
  server host.docker.internal:3000;
}

upstream api_dev {
  server host.docker.internal:5000;
}

upstream minio_s3 {
  server minio:9000;
}

# HTTP -> HTTPS redirect
server {
  listen 80;
  server_name modulon.local localhost;
  return 308 https://$host$request_uri;
}

# Main HTTPS server
server {
  listen 443 ssl;
  http2 on;

  server_name modulon.local localhost;

  ssl_certificate     /etc/nginx/certs/modulon.local.pem;
  ssl_certificate_key /etc/nginx/certs/modulon.local-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 50m;

  # ---- Common proxy headers ----
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  proxy_read_timeout 300s;

  # Simple health endpoint (does NOT depend on upstream apps)
  location = /health {
    return 200 "OK\n";
    add_header Content-Type text/plain;
  }

  # --- Next.js HMR WebSocket (DEV) ---
  location /_next/webpack-hmr {
    proxy_pass http://next_dev/_next/webpack-hmr;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # --- API (Nest, DEV lokalnie) ---
  location /api/ {
    proxy_pass http://api_dev/;

    # pass auth header if you need it downstream
    proxy_set_header Authorization $http_authorization;
  }

  # --- Front (Next.js, DEV lokalnie) ---
  location / {
    proxy_pass http://next_dev/;
  }

  # --- Keycloak under /auth ---
  location = /auth { return 301 /auth/; }

  location /auth/ {
    proxy_pass http://keycloak:8080/auth/;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # --- MinIO S3 under /minio/ (STRIP /minio prefix) ---
  location = /minio { return 301 /minio/; }

  location /minio/ {
    # trailing slash strips the /minio prefix (intentional)
    proxy_pass http://minio_s3/;

    # bigger uploads/streaming
    proxy_buffering off;
  }

  # --- MinIO Console under /minio-console/ (optional) ---
  # Note: Console behind a path prefix can be flaky (redirects/assets/ws).
  # Prefer keeping it on :9001 or a dedicated subdomain if problems occur.
  location = /minio-console { return 301 /minio-console/; }

  location /minio-console/ {
    proxy_pass http://minio:9001/;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
# EOF
