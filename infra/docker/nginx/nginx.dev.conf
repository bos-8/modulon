# // @file: infra/docker/compose/nginx/nginx.dev.conf
# Docker DNS resolver (required for container name resolution)
resolver 127.0.0.11 ipv6=off valid=10s;

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Upstreams
upstream next_dev {
  server host.docker.internal:3000;
}

upstream api_dev {
  server host.docker.internal:5000;
}

upstream keycloak_http {
  server keycloak:8080;
}

upstream minio_api {
  server minio:9000;
}

upstream minio_console {
  server minio:9001;
}


# -------------------------------------------------------------------
# HTTP -> HTTPS redirect (all related hostnames)
# -------------------------------------------------------------------
server {
  listen 80;
  server_name modulon.local localhost minio.modulon.local minioconsole.modulon.local [::1] 127.0.0.1;
  return 308 https://$host$request_uri;
}

# Main HTTPS server
server {
  listen 443 ssl;
  http2 on;

  server_name modulon.local localhost [::1] 127.0.0.1;

  ssl_certificate     /etc/nginx/certs/modulon.local.pem;
  ssl_certificate_key /etc/nginx/certs/modulon.local-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # HSTS (note: includeSubDomains requires HTTPS on subdomains too)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Unlimited upload size (useful for object storage and large payloads)
  client_max_body_size 0;

  # Common proxy settings
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;

  proxy_read_timeout 300s;

  # Disable buffering for large uploads/streaming
  proxy_buffering off;
  proxy_request_buffering off;

  # Simple health endpoint (does NOT depend on upstream apps)
  location = /health {
    default_type application/json;
    add_header Content-Type application/json always;
    return 200 '{"status":"ok","service":"nginx"}';
  }

  # --- Next.js HMR WebSocket (DEV) ---
  location /_next/webpack-hmr {
    proxy_pass http://next_dev/_next/webpack-hmr;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # --- API (Nest, DEV lokalnie) ---
  location /api/ {
    proxy_pass http://api_dev/;
    proxy_set_header Authorization $http_authorization;
  }

  # --- Keycloak under /auth ---
  location /auth/ {
    proxy_pass http://keycloak_http;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /minio         { return 308 https://minio.modulon.local/; }
  location = /minio-console { return 308 https://console.minio.modulon.local/; }

  # --- Front (Next.js, DEV lokalnie) ---
  location / {
    proxy_pass http://next_dev/;
  }

  location ^~ /api/auth/ {
    proxy_pass http://next_dev;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }


}



# -------------------------------------------------------------------
# MinIO S3 API on minio.modulon.local
# -------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;

  server_name minio.modulon.local;

  ssl_certificate     /etc/nginx/certs/modulon.local.pem;
  ssl_certificate_key /etc/nginx/certs/modulon.local-key.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 0;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;

  # Keep the original host for S3-style endpoints
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  proxy_read_timeout 300s;

  location / {
    proxy_pass http://minio_api;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    chunked_transfer_encoding off;
  }
}

# -------------------------------------------------------------------
# MinIO Console on minioconsole.modulon.local
# -------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;

  server_name minioconsole.modulon.local;

  ssl_certificate     /etc/nginx/certs/modulon.local.pem;
  ssl_certificate_key /etc/nginx/certs/modulon.local-key.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 0;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;

  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  proxy_read_timeout 300s;

  location / {
    proxy_pass http://minio_console/;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# EOF
